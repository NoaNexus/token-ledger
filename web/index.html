<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090A0F">
    <meta name="description" content="本地优先的个人 Token 用量账本">
    <title>Token 账本 - 本机用量工作台</title>
    <link rel="icon" type="image/x-icon" href="./assets/token-ledger.ico">
    <link rel="shortcut icon" href="./assets/token-ledger.ico">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <div class="app-shell" id="appShell" data-view-state="loading" data-active-tab="overview">
      <!-- Sticky Glass Topbar -->
      <header class="topbar">
        <div class="topbar-inner">
          
          <!-- Brand & Status -->
          <a class="brand" href="#overview" aria-label="Token 账本总览">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M7 8h10M7 12h7M7 16h10"></path>
              </svg>
            </span>
            <span class="brand-wordmark">
              <span class="brand-name">Token 账本</span>
              <span class="brand-badge">v2.3</span>
            </span>
            <div class="local-status" id="connectionStatus" role="status" aria-live="polite">
              <span class="status-dot status-dot--loading" aria-hidden="true"></span>
              <span id="connectionLabel">读取本机数据</span>
            </div>
          </a>

          <!-- Center Tabs (Always Visible) -->
          <nav class="segmented-control center-tabs" aria-label="主视图" role="tablist">
            <button class="segmented-btn is-active" id="tab-overview" type="button" role="tab" aria-selected="true" aria-controls="overviewPanel" data-tab="overview">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
              <span>总览仪表盘 (趋势曲线)</span>
            </button>
            <button class="segmented-btn" id="tab-detail" type="button" role="tab" aria-selected="false" aria-controls="detailPanel" data-tab="detail" tabindex="-1">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>智能体详情</span>
            </button>
            <button class="segmented-btn" id="tab-diagnostics" type="button" role="tab" aria-selected="false" aria-controls="diagnosticsPanel" data-tab="diagnostics" tabindex="-1">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
              <span>数据源与诊断</span>
            </button>
          </nav>

          <!-- Right Action Controls -->
          <div class="topbar-actions">
            
            <!-- Time Range Segmented Control -->
            <div class="segmented-control range-control" role="group" aria-label="观察范围">
              <button class="segmented-btn" type="button" data-range="1">今天</button>
              <button class="segmented-btn" type="button" data-range="7">7 天</button>
              <button class="segmented-btn is-active" type="button" data-range="30">30 天</button>
              <button class="segmented-btn" type="button" data-range="all">全部</button>
            </div>

            <!-- Scan Button -->
            <button class="button button-primary" id="scanButton" type="button" disabled>
              <span class="button-icon" id="scanIcon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10 3.2a6.8 6.8 0 1 0 6.1 3.8" stroke-linecap="round"></path>
                  <path d="M12.7 3.2h3.8V7" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span id="scanButtonLabel">扫描本机</span>
            </button>

            <!-- Theme Toggle Button -->
            <button class="theme-toggle-btn" id="themeToggleBtn" type="button" title="切换暗色/亮色主题" aria-label="切换暗色/亮色主题">
              <!-- Dark Icon (Moon) -->
              <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
              </svg>
              <!-- Light Icon (Sun) -->
              <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
            </button>

          </div>
        </div>
      </header>

      <!-- Main Workspace -->
      <main class="workspace" id="mainContent" aria-busy="true">
        
        <!-- Notices / Banners -->
        <div class="notice-stack" aria-live="polite">
          <div class="notice notice-preview" id="previewNotice" hidden>
            <span class="notice-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M10 2.8 17 6.5v7L10 17.2 3 13.5v-7l7-3.7Z" stroke-linejoin="round"></path>
                <path d="M6.3 8.3 10 10.2l3.7-1.9M10 10.2v4.1" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
            <span><strong>预览数据模式</strong>：本地接口暂不可达，以下展示内置高保真数据，不代表本机实际账本。</span>
            <button class="notice-action" id="previewRetry" type="button">重试连接</button>
          </div>
        </div>

        <!-- Skeleton Loading State -->
        <div class="loading-state" id="loadingState" aria-live="polite">
          <div class="loading-grid">
            <div class="skeleton skeleton-kpi"></div>
            <div class="skeleton skeleton-kpi"></div>
            <div class="skeleton skeleton-kpi"></div>
            <div class="skeleton skeleton-kpi"></div>
          </div>
          <div class="skeleton skeleton-flow"></div>
          <div class="skeleton skeleton-chart"></div>
          <p class="loading-label"><span class="loading-spinner" aria-hidden="true"></span>正在读取本机日志与 SQLite 索引…</p>
        </div>

        <!-- Error State -->
        <section class="error-state" id="errorState" hidden aria-live="assertive">
          <div class="error-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3.8 21 20H3l9-16.2Z" stroke-linejoin="round"></path>
              <path d="M12 9v5M12 17.2v.2" stroke-linecap="round"></path>
            </svg>
          </div>
          <div>
            <h2 id="errorTitle">无法连接本地数据接口</h2>
            <p id="errorMessage">请确认本地服务进程运行正常，然后重试。</p>
          </div>
          <button class="button button-secondary" id="errorRetry" type="button">重新连接</button>
        </section>

        <!-- Tab 1: Overview Panel -->
        <section class="tab-panel is-active" id="overviewPanel" role="tabpanel" aria-labelledby="tab-overview" data-panel="overview">
          <!-- Interactive Sub-header & Agent Filter Pills -->
          <div class="filter-header-bar" id="filterHeaderBar">
            <div class="filter-header-left">
              <span class="range-indicator-dot" id="rangeIndicatorDot"></span>
              <span id="currentRangeLabel" class="range-label">用量观察窗口 · 最近 30 天连续统计</span>
            </div>

            <!-- Agent Filter Pill Group (Direct Clickable) -->
            <div class="agent-pill-group" id="agentPills" role="radiogroup" aria-label="筛选智能体">
              <span class="pill-group-label">筛选智能体:</span>
              <button class="agent-pill-btn is-active" type="button" data-agent-filter="all">
                <span class="agent-dot" style="background:#3B82F6"></span>
                <span>全部</span>
                <span class="agent-pill-count" id="agentCountAll">(3)</span>
              </button>
              <button class="agent-pill-btn" type="button" data-agent-filter="codex">
                <span class="agent-dot" style="background:#3B82F6"></span>
                <span>Codex</span>
              </button>
              <button class="agent-pill-btn" type="button" data-agent-filter="claude">
                <span class="agent-dot" style="background:#F97316"></span>
                <span>Claude Code</span>
              </button>
              <button class="agent-pill-btn" type="button" data-agent-filter="antigravity">
                <span class="agent-dot" style="background:#8B5CF6"></span>
                <span>Antigravity</span>
              </button>
            </div>
          </div>

          <div id="overviewContent"></div>
        </section>

        <!-- Tab 2: Detail Panel -->
        <section class="tab-panel" id="detailPanel" role="tabpanel" aria-labelledby="tab-detail" data-panel="detail" hidden>
          <div id="detailContent"></div>
        </section>

        <!-- Tab 3: Diagnostics Panel -->
        <section class="tab-panel" id="diagnosticsPanel" role="tabpanel" aria-labelledby="tab-diagnostics" data-panel="diagnostics" hidden>
          <div id="diagnosticContent"></div>
        </section>

      </main>

      <!-- App Footer -->
      <footer class="app-footer">
        <div class="footer-inner">
          <span class="footer-brand">TOKEN LEDGER // 本机优先</span>
          <span class="mono" id="footerStatus">就绪</span>
          <span class="footer-right mono" id="toolbarMeta">纯本地 SQLite 索引 · 零云端上传</span>
        </div>
      </footer>
    </div>

    <!-- Global Floating Toast Notification -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="sr-only" id="liveAnnouncer" aria-live="polite"></div>

    <!-- Local Offline App Logic -->
    <script src="./app.js" defer></script>
  </body>
</html>
