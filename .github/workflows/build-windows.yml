name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean TokenLedgerNative.spec
      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path dist/TokenLedger -DestinationPath dist/TokenLedger-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TokenLedger-Windows
          path: dist/TokenLedger-Windows.zip
          if-no-files-found: error
      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/TokenLedger-Windows.zip
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
